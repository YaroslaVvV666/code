# Генератор проекта Xcode: brew install xcodegen && xcodegen generate && open Orbita.xcodeproj
name: Orbita
options:
  bundleIdPrefix: com.example      # поменяйте на свой, например com.ivan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""           # впишите свой Team ID или выберите Team в Xcode (Signing & Capabilities)
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 125.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0
targets:
  Orbita:
    type: application
    platform: iOS
    sources: [App, Core, Data, DesignSystem, Domain, Features]
    dependencies:
      - package: WebRTC
      - package: Lottie
      - target: OrbitaBroadcast          # показ всего экрана и в фоне (Broadcast Upload Extension)
    entitlements:
      path: App/Orbita.entitlements
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/Orbita.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.example.orbita
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Orbita
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Микрофон нужен для голосовых сообщений и видео-кружков.
        NSSpeechRecognitionUsageDescription: Нужно, чтобы расшифровывать голосовые сообщения в текст.
        NSCameraUsageDescription: Камера нужна для фото, видео-кружков и сканирования QR-кодов.
        NSContactsUsageDescription: Контакты нужны, чтобы найти друзей, которые уже в Orbita.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы отправлять их в чаты и публикации.
        NSPhotoLibraryAddUsageDescription: Нужно, чтобы сохранять фото и видео из чатов в галерею.
        NSLocalNetworkUsageDescription: Нужно для подключения к вашему серверу Orbita в локальной сети.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: orbita
            CFBundleURLSchemes: [orbita]
  OrbitaBroadcast:
    type: app-extension
    platform: iOS
    sources: [Extension/Broadcast]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.orbita.broadcast     # = идентификатор приложения + «.broadcast»
        INFOPLIST_FILE: Extension/Broadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Broadcast/Broadcast.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
