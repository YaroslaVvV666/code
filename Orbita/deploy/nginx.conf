# nginx перед воркерами Orbita. Заменяет /etc/nginx/nginx.conf целиком.
# Число server-строк в upstream должно совпадать с ORBITA_WORKERS (по умолчанию 4 -> порты 8080..8083).

user  nginx;
worker_processes auto;
events { worker_connections 4096; }

http {
    sendfile on;
    server_tokens off;

    # грубый лимит по IP (осмысленные лимиты по пользователю — в самом сервере)
    limit_req_zone $binary_remote_addr zone=orbita:10m rate=20r/s;

    # «липкая» маршрутизация: вошедшего — по токену, остальных — по IP, всегда в один воркер
    map $http_authorization $orbita_sticky {
        default   $binary_remote_addr;
        "~.+"     $http_authorization;
    }

    upstream orbita_workers {
        hash $orbita_sticky consistent;
        server app:8080 max_fails=2 fail_timeout=5s;
        server app:8081 max_fails=2 fail_timeout=5s;
        server app:8082 max_fails=2 fail_timeout=5s;
        server app:8083 max_fails=2 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 80;
        # listen 443 ssl http2;                  # для TLS: раскройте порт в compose и строки ниже
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        server_name _;

        client_max_body_size 60m;                 # загрузка видео

        # метрики — только изнутри (докер-сеть/локалхост), наружу закрыто
        location = /metrics {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://orbita_workers;
        }

        # медиа можно кэшировать (ответы уже immutable); для приватности — только если так задумано
        location /media/ {
            proxy_pass http://orbita_workers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=orbita burst=40 nodelay;
            proxy_pass http://orbita_workers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;               # long-poll (events/wait) не рвём раньше времени
        }
    }
}
